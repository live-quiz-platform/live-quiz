<main class="login-page">
  <section class="welcome-panel" aria-labelledby="welcome-title">
    <header class="welcome-header">
      <a class="brand" routerLink="/login" aria-label="Live Quiz, sign-in page">
        <span class="brand-mark" aria-hidden="true">Q<span></span></span>
        <span>Live Quiz<span class="brand-period">.</span></span>
      </a>
      <span class="live-badge"><span></span> Live quizzes</span>
    </header>

    <div class="welcome-content">
      <div class="welcome-copy">
        <h2 id="welcome-title" aria-label="Learn better together.">
          <app-animated-title [lines]="['Learn better', 'together.']" />
        </h2>
        <p>Take part in your class quizzes.</p>
      </div>

      <app-login-characters />
    </div>

    <footer class="welcome-footer">
      <span class="footer-line" aria-hidden="true"></span>
      Live quizzes for your classes
    </footer>
  </section>

  <section class="login-panel" aria-labelledby="recovery-title">
    <div class="login-box">
      <header class="login-heading">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="recovery-title">Forgot your password?</h1>
        <p class="login-description">Enter your email address and we'll send you a link to reset your password.</p>
      </header>

      <app-forgot-password-form />

      <p class="sign-up-prompt">
        <a class="sign-up-button back-to-login" routerLink="/login">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M16 10H4m5-5-5 5 5 5" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to sign in
        </a>
      </p>
    </div>
  </section>
</main>
