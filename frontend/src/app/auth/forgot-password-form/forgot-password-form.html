<form class="login-form" [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-field">
    <label for="recovery-email">Email</label>
    <div class="input-field">
      <svg class="field-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
        <rect x="2.5" y="4" width="15" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="m3.5 5 6.5 5 6.5-5" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input id="recovery-email" name="email" type="email" autocomplete="email"
        inputmode="email" placeholder="name@example.com" spellcheck="false"
        formControlName="email" required
        [class.input-invalid]="hasEmailError()"
        [attr.aria-invalid]="hasEmailError() ? 'true' : null"
        [attr.aria-describedby]="hasEmailError() ? 'recovery-email-error' : null">
    </div>
    @if (hasEmailError()) {
      <p class="field-error" id="recovery-email-error" role="alert">
        @if (recoveryForm.controls.email.hasError('required')) {
          Enter your email address.
        } @else {
          Enter a valid email address.
        }
      </p>
    }
  </div>

  <button class="login-button" type="submit">
    Send reset link
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>
