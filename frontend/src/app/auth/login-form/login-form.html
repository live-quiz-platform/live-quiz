<form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username"
      inputmode="email" placeholder="name@example.com" spellcheck="false"
      formControlName="email" required
      [class.input-invalid]="hasError('email')"
      [attr.aria-invalid]="hasError('email') ? 'true' : null"
      [attr.aria-describedby]="hasError('email') ? 'email-error' : null">
    @if (hasError('email')) {
      <p class="field-error" id="email-error" role="alert">
        @if (loginForm.controls.email.hasError('required')) {
          Enter your email address.
        } @else {
          Enter a valid email address.
        }
      </p>
    }
  </div>

  <div class="form-field">
    <label for="password">Password</label>
    <div class="password-field" (focusin)="onPasswordFocus()"
      (focusout)="onPasswordBlur($event)">
      <input id="password" name="password"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="current-password" placeholder="Enter your password"
        formControlName="password" required
        [class.input-invalid]="hasError('password')"
        [attr.aria-invalid]="hasError('password') ? 'true' : null"
        [attr.aria-describedby]="hasError('password') ? 'password-error' : null">
      <button class="password-toggle" type="button" aria-controls="password"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
        (click)="togglePasswordVisibility()">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"
            stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          @if (passwordVisible()) {
            <path d="m3 3 14 14" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
          }
        </svg>
      </button>
    </div>
    @if (hasError('password')) {
      <p class="field-error" id="password-error" role="alert">Enter your password.</p>
    }
  </div>

  <button class="login-button" type="submit">
    Sign in
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</form>
