
services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      COURSE_DB_PASSWORD: ${COURSE_DB_PASSWORD:?COURSE_DB_PASSWORD is required}
      SCORING_DB_PASSWORD: ${SCORING_DB_PASSWORD:?SCORING_DB_PASSWORD is required}

    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/init-postgres.sh:/docker-entrypoint-initdb.d/01-init-postgres.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:9.0.8
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}

    ports:
      - "${MONGO_DB_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -qx 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_DB_PORT:-6379}:6379"
    
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  nats:
    image: nats:2.15.3-alpine
    restart: unless-stopped

    command: ["-js", "-sd", "/data", "-m", "8222"]

    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
      
    volumes:
      - nats_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:8222/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  quiz-bank:
    build:
      context: .
      dockerfile: services/quiz-bank/Dockerfile
    restart: unless-stopped

    environment:
      GRPC_PORT: "50052"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27017/?authSource=admin

    ports:
      - "${QUIZ_BANK_PORT:-50052}:50052"

    depends_on:
      mongodb:
        condition: service_healthy

  identity-migrate:
    image: migrate/migrate:v4.20.1
    restart: "no"
    
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER_IDENTITY}:${IDENTITY_DB_PASSWORD}@postgres:5432/${POSTGRES_IDENTITY_DB}?sslmode=disable"
      - "up"

    volumes:
      - ./services/identity/migrations:/migrations:ro

    depends_on:
      postgres:
        condition: service_healthy

  identity-tls-init:
    image: alpine:3.24.4
    restart: "no"

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /certs/identity.crt ] || [ ! -s /certs/identity.key ]; then
          apk add --no-cache openssl
          umask 077
          openssl req -x509 -newkey rsa:3072 -sha256 -days 3650 -nodes \
            -keyout /certs/identity.key \
            -out /certs/identity.crt \
            -subj "/CN=localhost" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "subjectAltName=DNS:localhost,DNS:identity,IP:127.0.0.1"
          cp /certs/identity.crt /certs/ca.crt
          chown 65532:65532 /certs/identity.key
          chmod 0400 /certs/identity.key
          chmod 0444 /certs/identity.crt /certs/ca.crt
        fi

    volumes:
      - identity_tls:/certs

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB_PORT: 5432
      POSTGRES_USER_IDENTITY: ${POSTGRES_USER_IDENTITY:?POSTGRES_USER_IDENTITY is required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      POSTGRES_IDENTITY_DB: ${POSTGRES_IDENTITY_DB:?POSTGRES_IDENTITY_DB is required}
      POSTGRES_SSL_MODE: disable
      IDENTITY_GRPC_PORT: 50051
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      IDENTITY_JWT_EXPIRATION_MINUTES: ${IDENTITY_JWT_EXPIRATION_MINUTES:?IDENTITY_JWT_EXPIRATION_MINUTES is required}
      IDENTITY_TLS_CERT_FILE: /run/identity-tls/identity.crt
      IDENTITY_TLS_KEY_FILE: /run/identity-tls/identity.key

    ports:
      - "${IDENTITY_GRPC_PORT:-50051}:50051"

    volumes:
      - identity_tls:/run/identity-tls:ro

    healthcheck:
      test:
        [
          "CMD",
          "/grpc_health_probe",
          "-addr=localhost:50051",
          "-service=identity.v1.IdentityService",
          "-tls",
          "-tls-ca-cert=/run/identity-tls/ca.crt",
          "-tls-server-name=identity"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      identity-tls-init:
        condition: service_completed_successfully

  bff:
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    restart: unless-stopped

    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      IDENTITY_GRPC_URL: ${IDENTITY_GRPC_URL:-identity:50051}
      IDENTITY_TLS_CA_FILE: ${IDENTITY_TLS_CA_FILE:-/run/identity-tls/ca.crt}
      IDENTITY_TLS_SERVER_NAME: ${IDENTITY_TLS_SERVER_NAME:-identity}
      IDENTITY_PROTO_PATH: /app/proto/identity/v1/identity.proto
      QUIZ_BANK_GRPC_URL: ${QUIZ_BANK_GRPC_URL:-quiz-bank:50052}

    ports:
      - "${BFF_PORT:-3001}:3001"

    volumes:
      - identity_tls:/run/identity-tls:ro

    depends_on:
      identity:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  nats_data:
  identity_tls: