
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      COURSE_DB_PASSWORD: ${COURSE_DB_PASSWORD:?COURSE_DB_PASSWORD is required}
      SCORING_DB_PASSWORD: ${SCORING_DB_PASSWORD:?SCORING_DB_PASSWORD is required}

    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/init-postgres.sh:/docker-entrypoint-initdb.d/01-init-postgres.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:9.0.4
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}

    ports:
      - "${MONGO_DB_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -qx 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_DB_PORT:-6379}:6379"
    
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  nats:
    image: nats:2.15.2-alpine
    restart: unless-stopped

    command: ["-js", "-sd", "/data"]

    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
      
    volumes:
      - nats_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:8222/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  nats_data: