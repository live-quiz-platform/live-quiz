name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  quiz-bank:
    name: Quiz Bank
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/quiz-bank

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/quiz-bank/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Buf lint
        working-directory: proto
        run: buf lint

      - name: Generate gRPC stubs
        working-directory: .
        run: PYTHON=python bash scripts/gen_proto.sh

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Domain coverage threshold
        run: |
          if ls src/quiz_bank/*/domain/*.py 2>/dev/null | grep -qv '__init__.py'; then
            coverage report --include='*/domain/*' --fail-under=70
          else
            echo "Nu exista inca cod in domain/, pragul se sare."
          fi