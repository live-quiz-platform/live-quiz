name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  test-identity:
    if: ${{ false }}
    name: Test Identity Service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: identity_app
          POSTGRES_PASSWORD: identity_password
          POSTGRES_DB: identity_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_app -d identity_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/identity/go.mod
          cache-dependency-path: services/identity/go.sum

      - name: Check Go formatting
        working-directory: services/identity
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Verify Go modules
        working-directory: services/identity
        run: go mod verify

      - name: Run Go vet
        working-directory: services/identity
        run: go vet ./...

      - name: Build Identity Service
        working-directory: services/identity
        run: go build ./...

      - name: Run database migrations
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/services/identity/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1 \
            -path=/migrations \
            -database "postgres://identity_app:identity_password@localhost:5432/identity_db?sslmode=disable" \
            up

      - name: Run Identity tests
        working-directory: services/identity
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB_PORT: 5432
          POSTGRES_USER_IDENTITY: identity_app
          IDENTITY_DB_PASSWORD: identity_password
          POSTGRES_IDENTITY_DB: identity_db
          POSTGRES_SSL_MODE: disable
        run: go test -race -cover ./...

      - name: Build Identity Docker image
        run: docker build -t live-quiz-identity:ci ./services/identity

  quiz-bank:
    name: Quiz Bank
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/quiz-bank

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/quiz-bank/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Buf lint
        working-directory: proto
        run: buf lint

      - name: Generate gRPC stubs
        working-directory: .
        run: PYTHON=python bash scripts/gen_proto.sh

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Domain coverage threshold
        run: coverage report --include='*/domain/*' --fail-under=70
        run: docker build -t live-quiz-identity:ci ./services/identity
